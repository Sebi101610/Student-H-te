<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>student h@te</title>

<!-- Firebase -->
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-firestore-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-auth-compat.js"></script>

<style>
body{margin:0;font-family:Arial;background:linear-gradient(135deg,#667eea,#764ba2);}
header{background:#000;color:#fff;padding:20px;text-align:center;position:relative;}
.add-btn{position:absolute;right:20px;top:20px;width:45px;height:45px;font-size:28px;}
.info{background:#fff;margin:10px auto;padding:15px;max-width:800px;border-radius:8px;text-align:center;}
.container{max-width:800px;margin:auto;padding:10px;}
.form{display:none;background:#fff;padding:15px;border-radius:8px;}
.review{background:#fff;padding:15px;margin-top:15px;border-radius:8px;transition:transform .6s;}
.top{border:3px solid gold;background:#fffbe6;}
button{cursor:pointer;}
@media(max-width:600px){.add-btn{width:40px;height:40px;font-size:24px;}}
</style>
</head>

<body>

<header>
<h1>student h@te</h1>
<button class="add-btn" onclick="toggleForm()">+</button>
</header>

<div class="info">
<input id="email" placeholder="E-Mail">
<input id="password" type="password" placeholder="Passwort">
<button onclick="register()">Registrieren</button>
<button onclick="login()">Login</button>
<p id="userInfo"></p>
</div>

<div class="info">Hier kannst du deine Studenten Bewerten!</div>

<div class="container">
<div class="form" id="form">
<input id="vorname" placeholder="Vorname">
<input id="nachname" placeholder="Nachname">
<textarea id="kommentar" placeholder="Kommentar"></textarea>
<button onclick="addReview()">Hinzufügen</button>
</div>
<div id="reviews"></div>
</div>

<script>
/* 🔥 Firebase Config */
const firebaseConfig = {
  apiKey: "AIzaSyDxCMyTDgjlFPOsfILq7jkQzZ5K5yITBvU",
  authDomain: "student-hate.firebaseapp.com",
  projectId: "student-hate",
  storageBucket: "student-hate.firebasestorage.app",
  messagingSenderId: "268571338314",
  appId: "1:268571338314:web:0fa59f26a5e41569a368b3"
};

firebase.initializeApp(firebaseConfig);
const db = firebase.firestore();
const auth = firebase.auth();

/* 👑 ADMIN */
const ADMIN_EMAIL = "sebas.brock@mstud.ch";
const ADMIN_PASSWORD_HASH = "HIER_DEIN_HASH_EINFÜGEN";

/* 🔊 Sound */
const sound = new Audio("https://www.myinstants.com/media/sounds/notification.mp3");
let lastTop = null;

/* 🛑 Bad Words (NEU) */
const badWords = ["idiot","dumm","arsch","scheiße"];

function censorWord(word){
  if(word.length <= 2) return "*".repeat(word.length);
  return word[0] + "*".repeat(word.length - 2) + word[word.length - 1];
}

function filter(text){
  badWords.forEach(bad=>{
    const regex = new RegExp(bad,"gi");
    text = text.replace(regex, match => censorWord(match));
  });
  return text;
}

/* 🔐 Auth */
function register(){
 auth.createUserWithEmailAndPassword(email.value,password.value)
 .catch(e=>alert(e.message));
}
function login(){
 auth.signInWithEmailAndPassword(email.value,password.value)
 .catch(e=>alert(e.message));
}
function logout(){auth.signOut();}

auth.onAuthStateChanged(u=>{
 if(u){
   window.currentUser=u;
   window.isAdmin=u.email===ADMIN_EMAIL;
   userInfo.innerHTML=`${u.email} ${isAdmin?"👑 Admin":""}
   <button onclick="logout()">Logout</button>`;
 }else{
   window.currentUser=null;
   window.isAdmin=false;
   userInfo.innerHTML="Bitte einloggen";
 }
});

/* ➕ */
function toggleForm(){
 if(!currentUser){alert("Login nötig");return;}
 form.style.display=form.style.display==="block"?"none":"block";
}

/* 💬 */
const WEEK=7*24*60*60*1000;
function addReview(){
 if(!currentUser)return;
 if(!vorname.value||!nachname.value||!kommentar.value)return;
 db.collection("reviews").add({
   uid:currentUser.uid,
   vorname:vorname.value,
   nachname:nachname.value,
   kommentar:kommentar.value,
   likes:0,
   createdAt:Date.now()
 });
 form.style.display="none";
 vorname.value=nachname.value=kommentar.value="";
}
function like(id,l){
 if(!currentUser)return;
 db.collection("reviews").doc(id).update({likes:l+1});
}
function report(id){
 db.collection("reports").add({id,time:Date.now()});
 alert("Gemeldet");
}

/* 🔑 Admin Passwort */
async function checkAdmin(){
 const pw=prompt("Admin Passwort:");
 if(!pw)return false;
 const buf=await crypto.subtle.digest("SHA-256",new TextEncoder().encode(pw));
 const hash=[...new Uint8Array(buf)].map(b=>b.toString(16).padStart(2,"0")).join("");
 return hash===ADMIN_PASSWORD_HASH;
}
async function deleteReview(id){
 if(!isAdmin)return;
 if(!(await checkAdmin())){alert("Falsch");return;}
 if(confirm("Wirklich löschen?")) db.collection("reviews").doc(id).delete();
}

/* 🎬 Animation */
const box=document.getElementById("reviews");
const map=new Map();

db.collection("reviews")
.where("createdAt",">",Date.now()-WEEK)
.onSnapshot(s=>{
 const data=s.docs.map(d=>({id:d.id,...d.data()}))
 .sort((a,b)=>b.likes-a.likes);

 const first=new Map();
 [...box.children].forEach(e=>first.set(e.dataset.id,e.getBoundingClientRect().top));

 data.forEach((r,i)=>{
  let el=map.get(r.id);
  if(!el){
   el=document.createElement("div");
   el.className="review";
   el.dataset.id=r.id;
   map.set(r.id,el);
   box.appendChild(el);
  }
  if(i===0){
   el.classList.add("top");
   if(lastTop!==r.id){sound.play();lastTop=r.id;}
  }else el.classList.remove("top");

  el.innerHTML=`
  <b>${i===0?"👑 ":""}${r.vorname} ${r.nachname}</b>
  <p>${filter(r.kommentar)}</p>
  <button onclick="like('${r.id}',${r.likes})">❤️ ${r.likes}</button>
  <button onclick="report('${r.id}')">🚩</button>
  ${isAdmin?`<button onclick="deleteReview('${r.id}')">🗑️</button>`:""}
  `;
 });

 data.forEach(r=>box.appendChild(map.get(r.id)));

 [...box.children].forEach(el=>{
  const d=first.get(el.dataset.id)-el.getBoundingClientRect().top;
  if(d){
   el.style.transform=`translateY(${d}px)`;
   el.style.transition="0s";
   requestAnimationFrame(()=>{
    el.style.transition=".6s";
    el.style.transform="";
   });
  }
 });
});
</script>

</body>
</html>
