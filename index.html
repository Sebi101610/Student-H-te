<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<title>student h@te</title>

<!-- Firebase -->
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-firestore-compat.js"></script>

<style>
body{
    margin:0;
    font-family:Arial,sans-serif;
    background:linear-gradient(135deg,#667eea,#764ba2);
}
header{
    background:rgba(0,0,0,0.75);
    color:white;
    padding:20px;
    position:relative;
    text-align:center;
}
.add-btn{
    position:absolute;
    top:20px;
    right:20px;
    width:45px;
    height:45px;
    font-size:28px;
    background:#4CAF50;
    color:white;
    border:none;
    cursor:pointer;
}
.info-box{
    background:white;
    max-width:700px;
    margin:20px auto;
    padding:15px;
    text-align:center;
    border-radius:8px;
}
.container{
    max-width:800px;
    margin:auto;
    padding:15px;
}
.form{
    display:none;
    background:white;
    padding:15px;
    border-radius:8px;
    margin-bottom:20px;
}
.form input,.form textarea{
    width:100%;
    margin:8px 0;
    padding:8px;
}
.review{
    background:white;
    padding:15px;
    margin-top:15px;
    border-radius:8px;
    transition:transform 0.6s ease;
}
.top{
    border:3px solid gold;
}
.slide{
    animation:slideTop 0.6s ease;
}
@keyframes slideTop{
    from{transform:translateY(40px);}
    to{transform:translateY(0);}
}
.like-btn{
    background:none;
    border:none;
    font-size:16px;
    color:#e91e63;
    cursor:pointer;
}
</style>
</head>
<body>

<header>
    <h1>student h@te</h1>
    <button class="add-btn" onclick="toggleForm()">+</button>
</header>

<div class="info-box">
    Hier kannst du deine Studenten Bewerten!
</div>

<div class="container">
    <div class="form" id="form">
        <input id="vorname" placeholder="Vorname">
        <input id="nachname" placeholder="Nachname">
        <textarea id="kommentar" placeholder="Kommentar"></textarea>
        <button onclick="addReview()">Hinzufügen</button>
    </div>
    <div id="reviews"></div>
</div>

<script>
/* 🔥 DEINE FIREBASE DATEN HIER EINSETZEN */
const firebaseConfig = {
    apiKey: "DEIN_API_KEY",
    authDomain: "DEIN_PROJEKT.firebaseapp.com",
    projectId: "DEIN_PROJEKT_ID"
};

firebase.initializeApp(firebaseConfig);
const db = firebase.firestore();

let lastTopId = null;

function toggleForm(){
    const f=document.getElementById("form");
    f.style.display=f.style.display==="block"?"none":"block";
}

function addReview(){
    const v=vorname.value.trim();
    const n=nachname.value.trim();
    const k=kommentar.value.trim();
    if(!v||!n||!k)return alert("Alle Felder ausfüllen!");
    db.collection("reviews").add({
        vorname:v,
        nachname:n,
        kommentar:k,
        likes:0,
        time:Date.now()
    });
    form.style.display="none";
    vorname.value=nachname.value=kommentar.value="";
}

function like(id,likes){
    db.collection("reviews").doc(id).update({likes:likes+1});
}

db.collection("reviews")
.orderBy("likes","desc")
.onSnapshot(snap=>{
    const c=document.getElementById("reviews");
    c.innerHTML="";
    snap.forEach((doc,i)=>{
        const r=doc.data();
        const isTop=i===0;
        const slide=isTop && doc.id!==lastTopId?"slide":"";
        if(isTop) lastTopId=doc.id;

        c.innerHTML+=`
        <div class="review ${isTop?"top":""} ${slide}">
            <strong>${r.vorname} ${r.nachname}</strong>
            <p>${r.kommentar}</p>
            <button class="like-btn" onclick="like('${doc.id}',${r.likes})">
                ❤️ ${r.likes}
            </button>
        </div>`;
    });
});
</script>

</body>
</html>
