<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<title>student h@te</title>

<!-- Firebase -->
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-firestore-compat.js"></script>

<style>
body{
    margin:0;
    font-family:Arial,sans-serif;
    background:linear-gradient(135deg,#667eea,#764ba2);
}
header{
    background:rgba(0,0,0,0.8);
    color:white;
    padding:20px;
    position:relative;
    text-align:center;
}
.add-btn{
    position:absolute;
    top:20px;
    right:20px;
    width:45px;
    height:45px;
    font-size:28px;
    background:#4CAF50;
    color:white;
    border:none;
    cursor:pointer;
}
.info-box{
    background:white;
    max-width:700px;
    margin:20px auto;
    padding:15px;
    text-align:center;
    border-radius:8px;
}
.container{
    max-width:800px;
    margin:auto;
    padding:15px;
}
.form{
    display:none;
    background:white;
    padding:15px;
    border-radius:8px;
    margin-bottom:20px;
}
.form input,.form textarea{
    width:100%;
    margin:8px 0;
    padding:8px;
}
.review{
    background:white;
    padding:15px;
    margin-top:15px;
    border-radius:8px;
    transition:transform 0.6s ease;
}
.top{
    border:3px solid gold;
}
.like-btn{
    background:none;
    border:none;
    font-size:16px;
    color:#e91e63;
    cursor:pointer;
}
</style>
</head>
<body>

<header>
    <h1>student h@te</h1>
    <button class="add-btn" onclick="toggleForm()">+</button>
</header>

<div class="info-box">
    Hier kannst du deine Studenten Bewerten!
</div>

<div class="container">
    <div class="form" id="form">
        <input id="vorname" placeholder="Vorname">
        <input id="nachname" placeholder="Nachname">
        <textarea id="kommentar" placeholder="Kommentar"></textarea>
        <button onclick="addReview()">Hinzufügen</button>
    </div>
    <div id="reviews"></div>
</div>

<script>
/* 🔥 DEINE FIREBASE CONFIG (EINGEFÜGT) */
const firebaseConfig = {
  apiKey: "AIzaSyDxCMyTDgjlFPOsfILq7jkQzZ5K5yITBvU",
  authDomain: "student-hate.firebaseapp.com",
  projectId: "student-hate",
  storageBucket: "student-hate.firebasestorage.app",
  messagingSenderId: "268571338314",
  appId: "1:268571338314:web:0fa59f26a5e41569a368b3",
  measurementId: "G-VJZYNNGPZY"
};

firebase.initializeApp(firebaseConfig);
const db = firebase.firestore();

const ONE_WEEK = 7 * 24 * 60 * 60 * 1000;
let oldPositions = new Map();

function toggleForm(){
    form.style.display = form.style.display === "block" ? "none" : "block";
}

function addReview(){
    if(!vorname.value || !nachname.value || !kommentar.value){
        alert("Bitte alle Felder ausfüllen!");
        return;
    }

    db.collection("reviews").add({
        vorname: vorname.value,
        nachname: nachname.value,
        kommentar: kommentar.value,
        likes: 0,
        createdAt: Date.now()
    });

    form.style.display="none";
    vorname.value = nachname.value = kommentar.value = "";
}

function like(id, likes){
    db.collection("reviews").doc(id).update({ likes: likes + 1 });
}

/* 🧹 ALTE KOMMENTARE (> 1 WOCHE) LÖSCHEN */
function cleanupOldReviews(){
    const limit = Date.now() - ONE_WEEK;
    db.collection("reviews")
      .where("createdAt","<",limit)
      .get()
      .then(snap=>{
          snap.forEach(doc => doc.ref.delete());
      });
}

cleanupOldReviews();

/* 🔄 LIVE + ANIMATION (FLIP) */
db.collection("reviews")
.where("createdAt",">",Date.now() - ONE_WEEK)
.orderBy("createdAt")
.onSnapshot(snapshot => {

    const container = document.getElementById("reviews");

    // Alte Positionen speichern
    oldPositions.clear();
    [...container.children].forEach(el=>{
        oldPositions.set(el.dataset.id, el.getBoundingClientRect().top);
    });

    // Sortieren nach Likes
    const docs = snapshot.docs.sort(
        (a,b)=>b.data().likes - a.data().likes
    );

    container.innerHTML = "";

    docs.forEach((doc,i)=>{
        const r = doc.data();
        const div = document.createElement("div");
        div.className = "review" + (i===0 ? " top" : "");
        div.dataset.id = doc.id;
        div.innerHTML = `
            <strong>${r.vorname} ${r.nachname}</strong>
            <p>${r.kommentar}</p>
            <button class="like-btn" onclick="like('${doc.id}',${r.likes})">
                ❤️ ${r.likes}
            </button>
        `;
        container.appendChild(div);
    });

    // FLIP Animation
    [...container.children].forEach(el=>{
        const oldTop = oldPositions.get(el.dataset.id);
        if(oldTop !== undefined){
            const newTop = el.getBoundingClientRect().top;
            const delta = oldTop - newTop;
            if(delta !== 0){
                el.style.transform = `translateY(${delta}px)`;
                el.offsetHeight;
                el.style.transform = "";
            }
        }
    });
});
</script>

</body>
</html>
