<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <title>student h@te</title>

    <style>
        body {
            margin: 0;
            font-family: Arial, sans-serif;
            min-height: 100vh;
            background: linear-gradient(135deg, #667eea, #764ba2);
        }

        header {
            background: rgba(0,0,0,0.75);
            color: white;
            padding: 20px;
            position: relative;
        }

        header h1 {
            margin: 0;
            text-align: center;
            font-size: 28px;
        }

        .add-btn {
            position: absolute;
            top: 20px;
            right: 20px;
            width: 45px;
            height: 45px;
            font-size: 28px;
            background: #4CAF50;
            color: white;
            border: none;
            cursor: pointer;
        }

        .info-box {
            background: white;
            color: #333;
            max-width: 700px;
            margin: 20px auto;
            padding: 15px;
            text-align: center;
            border-radius: 8px;
            font-size: 18px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.2);
        }

        .container {
            max-width: 800px;
            margin: 0 auto;
            padding: 15px;
        }

        .form {
            display: none;
            background: white;
            padding: 15px;
            border-radius: 8px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.2);
            margin-bottom: 20px;
        }

        .form input,
        .form textarea {
            width: 100%;
            padding: 8px;
            margin: 8px 0;
            font-size: 14px;
        }

        .form button {
            background: #4CAF50;
            color: white;
            border: none;
            padding: 10px;
            cursor: pointer;
        }

        .review {
            background: white;
            padding: 15px;
            margin-top: 15px;
            border-radius: 8px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.15);
        }

        /* ⭐ TOP KOMMENTAR ANIMATION ⭐ */
        .top-review {
            border: 3px solid gold;
            animation: pulse 1.5s infinite;
        }

        @keyframes pulse {
            0% { transform: scale(1); box-shadow: 0 0 10px gold; }
            50% { transform: scale(1.03); box-shadow: 0 0 20px gold; }
            100% { transform: scale(1); box-shadow: 0 0 10px gold; }
        }

        .like-btn {
            background: none;
            border: none;
            color: #e91e63;
            font-size: 16px;
            cursor: pointer;
        }
    </style>
</head>
<body>

<header>
    <h1>student h@te</h1>
    <button class="add-btn" onclick="toggleForm()">+</button>
</header>

<div class="info-box">
    Hier kannst du deine Studenten Bewerten!
</div>

<div class="container">

    <div class="form" id="form">
        <input type="text" id="vorname" placeholder="Vorname">
        <input type="text" id="nachname" placeholder="Nachname">
        <textarea id="kommentar" placeholder="Kommentar"></textarea>
        <button onclick="addReview()">Bewertung hinzufügen</button>
    </div>

    <div id="reviews"></div>
</div>

<script>
    let reviews = JSON.parse(localStorage.getItem("reviews")) || [];

    function toggleForm() {
        const form = document.getElementById("form");
        form.style.display = form.style.display === "block" ? "none" : "block";
    }

    function addReview() {
        const vorname = document.getElementById("vorname").value.trim();
        const nachname = document.getElementById("nachname").value.trim();
        const kommentar = document.getElementById("kommentar").value.trim();

        if (!vorname || !nachname || !kommentar) {
            alert("Bitte alle Felder ausfüllen!");
            return;
        }

        reviews.push({
            vorname,
            nachname,
            kommentar,
            likes: 0
        });

        saveAndRender();

        document.getElementById("vorname").value = "";
        document.getElementById("nachname").value = "";
        document.getElementById("kommentar").value = "";
        document.getElementById("form").style.display = "none";
    }

    function likeReview(index) {
        reviews[index].likes++;
        saveAndRender();
    }

    function saveAndRender() {
        localStorage.setItem("reviews", JSON.stringify(reviews));
        renderReviews();
    }

    function renderReviews() {
        const container = document.getElementById("reviews");
        container.innerHTML = "";

        // Sortieren: meiste Likes zuerst
        const sorted = [...reviews].sort((a, b) => b.likes - a.likes);

        sorted.forEach((r, i) => {
            const index = reviews.indexOf(r);
            const topClass = i === 0 && r.likes > 0 ? "top-review" : "";

            container.innerHTML += `
                <div class="review ${topClass}">
                    <strong>${r.vorname} ${r.nachname}</strong>
                    <p>${r.kommentar}</p>
                    <button class="like-btn" onclick="likeReview(${index})">
                        ❤️ ${r.likes}
                    </button>
                </div>
            `;
        });
    }

    renderReviews();
</script>

</body>
</html>
